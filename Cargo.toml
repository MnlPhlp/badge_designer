[package]
name = "badge_designer"
version = "0.1.0"
authors = ["MnlPhlp <online@philipp-manuel.de>"]
edition = "2021"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "badge_designer"
path = "src/main.rs"

[dependencies]
slint = "1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[build-dependencies]
slint-build = "1.9"

# Always compile Slint with optimizations for better performance
[profile.dev.package.slint]
opt-level = 3

[profile.dev.package.i-slint-backend-winit]
opt-level = 3

[profile.dev.package.i-slint-core]
opt-level = 3

[profile.dev.package.i-slint-renderer-skia]
opt-level = 3

[profile.dev.package."*"]
opt-level = 1

